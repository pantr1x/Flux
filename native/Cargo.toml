[package]
name = "flux-native"
version = "0.9.48"
edition = "2021"
license = "MIT"
description = "Flux – natívna verzia v Ruste (egui), bez Chromia"

[[bin]]
name = "flux-native"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
flux-core = { path = "../crates/flux-core" }
serde_json = "1"
log = "0.4"
dirs = "6"
eframe = { version = "0.36", default-features = false, features = ["glow", "wgpu", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.36", features = ["syntect", "svg"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif"] }
alacritty_terminal = "0.26"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }
rfd = "0.15"
notify = "8"
zstd = { version = "0.13", default-features = false }
rquickjs = { version = "0.14", default-features = false, features = ["futures"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"
wry = { version = "0.57", default-features = false }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Foundation"] }
