name: Website

# Web Fluxu je Rust program (crates/flux-site): zostaví stránku → vetva gh-pages → GitHub Pages.
# Raz treba zapnúť: Settings → Pages → Build and deployment → Source: Deploy from a branch → gh-pages / (root).
on:
  push:
    paths:
      - 'crates/flux-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the website
        run: cargo run -q --release -p flux-site -- out
      - name: Publish to gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
