# Porovnanie Flux vs VS Code na Windowse (scripts/compare-vscode.ps1).
# Nainštaluje najnovší Flux z Releases a VS Code s rozšírením Python + Pylance (aby oba mali doplňovanie pre Python)
# a vypíše tabuľku do logu aj do súhrnu behu (Actions → Compare with VS Code → Summary).
name: Compare with VS Code

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['scripts/compare-vscode.ps1', '.github/workflows/compare.yml']

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flux and VS Code
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/pantr1x/Flux/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $rel.assets | Where-Object name -like '*.exe' | Select-Object -First 1
          Write-Host "Flux $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile flux-setup.exe
          $p = Start-Process .\flux-setup.exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { throw 'Flux install timed out' }
          Start-Sleep 3
          Get-Process Flux -ErrorAction SilentlyContinue | Stop-Process -Force
          # úvod preskočiť, nech sa hneď otvorí editor (ako u bežného používateľa)
          $ud = "$env:APPDATA\Flux"
          New-Item -ItemType Directory -Force $ud | Out-Null
          Set-Content "$ud\settings.json" ('{"onboarded":true,"lastSeenVersion":"' + $rel.tag_name.TrimStart('v') + '"}')

          Invoke-WebRequest 'https://update.code.visualstudio.com/latest/win32-x64/stable' -OutFile vscode-setup.exe
          $p = Start-Process .\vscode-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MERGETASKS=!runcode' -PassThru
          if (-not $p.WaitForExit(600000)) { throw 'VS Code install timed out' }
          $code = "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd"
          & $code --install-extension ms-python.python --force
          & $code --install-extension ms-python.vscode-pylance --force
          & $code --list-extensions
      - name: Compare
        shell: powershell
        run: |
          .\scripts\compare-vscode.ps1 -Runs 3 -Settle 30 *>&1 | Tee-Object -FilePath compare.txt
          $table = (Get-Content compare.txt -Raw) -replace '(?s)^.*?(\| \| Flux)', '$1' -replace '(?s)(_Measured on[^\n]*).*$', '$1'
          Add-Content $env:GITHUB_STEP_SUMMARY "## Flux vs VS Code`n`n$table"
