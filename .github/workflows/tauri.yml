# Flux v Ruste (Tauri, priečinok desktop/): zostaví ho na Windows a zmeria pamäť oproti Electron verzii.
# Obe verzie sa spustia s rovnakým projektom a nastaveniami; výsledok je v súhrne behu (Summary)
# a v artefakte Flux-Tauri (program, inštalátor, screenshoty, memory.txt).
name: Tauri build

on:
  push:
    branches: [main, 'claude/**']
    paths: ['desktop/**', 'scripts/tauri-bridge.mjs', 'src/**', '.github/workflows/tauri.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the UI and the bridge
        run: |
          node scripts/build.mjs
          node scripts/tauri-bridge.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build Flux (Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build Flux (Electron, unpacked) for comparison
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Measure memory (Tauri vs Electron)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory out -Force | Out-Null
          # rovnaký malý projekt a nastavenia pre obe verzie
          $proj = "$env:RUNNER_TEMP\demo-project"
          New-Item -ItemType Directory $proj -Force | Out-Null
          Set-Content "$proj\main.py" ("import os`n" + ((1..200) | ForEach-Object { "print('line $_')" }) -join "`n")
          Set-Content "$proj\index.html" "<!doctype html><h1>Hi</h1>"
          function Settings($dir) {
            New-Item -ItemType Directory $dir -Force | Out-Null
            @{ onboarded = $true; lastFolder = $proj; projects = @(@{ dir = $proj; pinned = $false }); recent = @($proj); translucent = $false; autoUpdate = $false; lastSeenVersion = 'x' } | ConvertTo-Json -Depth 5 | Set-Content "$dir\settings.json"
          }
          function Tree($rootPid) {
            $all = Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name
            $ids = @($rootPid); $added = $true
            while ($added) { $added = $false; foreach ($p in $all) { if ($ids -contains $p.ParentProcessId -and -not ($ids -contains $p.ProcessId)) { $ids += $p.ProcessId; $added = $true } } }
            $ids
          }
          function PrivateWS($ids) {
            # to isté číslo ako „Pamäť“ v Správcovi úloh (súkromná pracovná množina)
            $c = (Get-Counter '\Process(*)\ID Process', '\Process(*)\Working Set - Private' -ErrorAction SilentlyContinue).CounterSamples
            $byInst = @{}
            foreach ($s in $c) { $inst = $s.InstanceName; if (-not $byInst[$inst]) { $byInst[$inst] = @{} }; if ($s.Path -match 'id process') { $byInst[$inst].id = [int]$s.CookedValue } else { $byInst[$inst].ws = [double]$s.CookedValue } }
            $sum = 0; $rows = @()
            foreach ($v in $byInst.Values) { if ($ids -contains $v.id) { $sum += $v.ws; $rows += "{0,8:N1} MB  pid {1}" -f ($v.ws / 1MB), $v.id } }
            @{ total = [math]::Round($sum / 1MB, 1); rows = $rows }
          }
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }
          $report = @()
          # --- Tauri ---
          $td = "$env:RUNNER_TEMP\ud-tauri"; Settings $td
          $env:FLUX_USER_DATA = $td
          $exe = (Get-ChildItem desktop\target\release\flux.exe).FullName
          $p = Start-Process $exe -PassThru
          Start-Sleep 25
          Shot 'tauri'
          $m = PrivateWS (Tree $p.Id)
          $report += "Tauri (Rust): $($m.total) MB"; $report += $m.rows
          Get-CimInstance Win32_Process | Where-Object { (Tree $p.Id) -contains $_.ProcessId } | ForEach-Object { $report += "   $($_.ProcessId) $($_.Name)" }
          Stop-Process -Id (Tree $p.Id) -Force -ErrorAction SilentlyContinue
          Remove-Item Env:FLUX_USER_DATA
          Start-Sleep 3
          # --- Electron ---
          $ed = "$env:RUNNER_TEMP\ud-electron"; Settings $ed
          $eexe = (Get-ChildItem release\win-unpacked\Flux.exe).FullName
          $p = Start-Process $eexe -ArgumentList "--user-data-dir=$ed" -PassThru
          Start-Sleep 25
          Shot 'electron'
          $m = PrivateWS (Tree $p.Id)
          $report += "Electron: $($m.total) MB"; $report += $m.rows
          Stop-Process -Id (Tree $p.Id) -Force -ErrorAction SilentlyContinue
          $report += "Installer sizes:"
          Get-ChildItem desktop\target\release\bundle\nsis\*.exe | ForEach-Object { $report += "  Tauri: $([math]::Round($_.Length / 1MB, 1)) MB" }
          $report | Set-Content out\memory.txt
          $report | ForEach-Object { Write-Host $_ }
          "## Memory (Task Manager private working set)`n``````n$($report -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flux-Tauri
          path: |
            out/*
            desktop/target/release/bundle/nsis/*.exe
