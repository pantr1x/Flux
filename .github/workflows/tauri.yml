# Flux v Ruste (Tauri, priečinok desktop/): zostaví ho na Windows a zmeria pamäť oproti Electron verzii.
# Obe verzie sa spustia s rovnakým projektom a nastaveniami; výsledok je v súhrne behu (Summary)
# a v artefakte Flux-Tauri (program, inštalátor, screenshoty, memory.txt).
name: Tauri build

on:
  push:
    branches: [main, 'claude/**']
    paths: ['desktop/**', 'scripts/tauri-bridge.mjs', 'src/**', '.github/workflows/tauri.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the UI and the bridge
        run: |
          node scripts/build.mjs
          node scripts/tauri-bridge.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build Flux (Tauri)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build Flux (Electron, unpacked) for comparison
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Measure memory (Tauri vs Electron)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory out -Force | Out-Null
          # rovnaký malý projekt a nastavenia pre obe verzie
          $proj = "$env:RUNNER_TEMP\demo-project"
          New-Item -ItemType Directory $proj -Force | Out-Null
          Set-Content "$proj\main.py" ("import os`n" + ((1..200) | ForEach-Object { "print('line $_')" }) -join "`n")
          Set-Content "$proj\index.html" "<!doctype html><h1>Hi</h1>"
          function Settings($dir) {
            New-Item -ItemType Directory $dir -Force | Out-Null
            @{ onboarded = $true; lastFolder = $proj; projects = @(@{ dir = $proj; pinned = $false }); recent = @($proj); translucent = $false; autoUpdate = $false; lastSeenVersion = 'x' } | ConvertTo-Json -Depth 5 | Set-Content "$dir\settings.json"
          }
          function Tree($rootPid) {
            $all = Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name
            $ids = @($rootPid); $added = $true
            while ($added) { $added = $false; foreach ($p in $all) { if ($ids -contains $p.ParentProcessId -and -not ($ids -contains $p.ProcessId)) { $ids += $p.ProcessId; $added = $true } } }
            $ids
          }
          function Get-FluxMem($rootPid) {
            # „Pamäť“ zo Správcu úloh = súkromná pracovná množina; id a hodnota v tom istom riadku (žiadne párovanie podľa mena)
            $ids = Tree $rootPid
            $perf = Get-CimInstance Win32_PerfFormattedData_PerfProc_Process | Where-Object { $ids -contains [int]$_.IDProcess }
            $procs = Get-Process -Id $ids -ErrorAction SilentlyContinue
            @{
              priv = [math]::Round((($perf | Measure-Object WorkingSetPrivate -Sum).Sum) / 1MB, 1)
              ws = [math]::Round((($procs | Measure-Object WorkingSet64 -Sum).Sum) / 1MB, 1)
              rows = @($perf | Sort-Object WorkingSetPrivate -Descending | ForEach-Object { "{0,8:N1} MB  {1} (pid {2})" -f ($_.WorkingSetPrivate / 1MB), $_.Name, $_.IDProcess })
              count = $ids.Count
            }
          }
          function Start-FluxRun($label, $exe, $argList) {
            $p = if ($argList) { Start-Process $exe -ArgumentList $argList -PassThru } else { Start-Process $exe -PassThru }
            Start-Sleep 40
            Shot $label
            # tri merania po 5 s, berie sa stredné
            $ms = @(); for ($i = 0; $i -lt 3; $i++) { $ms += ,(Get-FluxMem $p.Id); Start-Sleep 5 }
            $mid = @($ms | Sort-Object { $_['priv'] })[[math]::Floor($ms.Count / 2)]
            if (-not $mid) { $mid = $ms[-1] }
            $out = @("$label : $($mid.priv) MB private (Task Manager), $($mid.ws) MB working set, $($mid.count) processes") + ($mid.rows | ForEach-Object { "   $_" })
            Stop-Process -Id (Tree $p.Id) -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
            $out
          }
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }
          $report = @()
          $td = "$env:RUNNER_TEMP\ud-tauri"; Settings $td
          $env:FLUX_USER_DATA = $td
          try { $report += Start-FluxRun 'tauri' (Get-ChildItem desktop\target\release\flux.exe).FullName $null } catch { $report += "tauri: measurement failed: $_" }
          Remove-Item Env:FLUX_USER_DATA
          $ed = "$env:RUNNER_TEMP\ud-electron"; Settings $ed
          try { $report += Start-FluxRun 'electron' (Get-ChildItem release\win-unpacked\Flux.exe).FullName "--user-data-dir=$ed" } catch { $report += "electron: measurement failed: $_" }
          $report += "Installer sizes:"
          Get-ChildItem desktop\target\release\bundle\nsis\*.exe | ForEach-Object { $report += "  Tauri: $([math]::Round($_.Length / 1MB, 1)) MB" }
          $report | Set-Content out\memory.txt
          $report | ForEach-Object { Write-Host $_ }
          "## Memory`n``````n$($report -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
      # screenshoty a čísla na vetvu ci-tauri: git show origin/ci-tauri:tauri.png > x.png
      - name: Publish screenshots (branch ci-tauri)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b ci-tauri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Tauri measurement from ${GITHUB_SHA::7}"
          for i in 1 2 3 4; do git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-tauri && exit 0; sleep $((i * 5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flux-Tauri
          path: |
            out/*
            desktop/target/release/bundle/nsis/*.exe
