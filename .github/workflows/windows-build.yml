# Zostaví inštalátor Flux-Setup-x.y.z.exe pre Windows.
# Stiahneš ho v záložke Actions → posledný beh → Artifacts → Flux-Windows.
name: Windows build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Flux-Windows
          path: release/*.exe
          if-no-files-found: error
      # Test aktualizácie: rovnako ako Flux (--updated --force-run, viditeľný inštalátor) –
      # inštalátor smie ukázať len priebeh, nesmie čakať na kliknutie a Flux sa má potom otvoriť.
      - name: Update test (installer shows only progress)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem release\Flux-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { throw 'First install timed out' }
          Start-Sleep 3
          Get-Process Flux -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType File "$env:TEMP\flux-relaunch-after-update" -Force | Out-Null
          # počas aktualizácie screenshoty obrazovky – dôkaz, že je vidieť pruh priebehu (vetva ci-screens)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory shots -Force | Out-Null
          function Shot($name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "screenshot failed: $_" }
          }
          $p = Start-Process $exe -ArgumentList '--updated', '--force-run' -PassThru
          $i = 0; $titles = @()
          while (-not $p.HasExited -and $i -lt 300) {
            Start-Sleep -Milliseconds 1000
            Shot ('update-{0:D3}' -f $i)
            $titles += (Get-Process | Where-Object { $_.MainWindowTitle -match 'Flux' } | ForEach-Object { "$i $($_.ProcessName): $($_.MainWindowTitle)" })
            $i++
          }
          $titles | Select-Object -Unique | Set-Content shots\windows.txt
          Get-Content shots\windows.txt
          if (-not $p.HasExited) { Stop-Process $p -Force; throw 'The update installer waited for a click - it must only show progress.' }
          Write-Host "Installer exit code: $($p.ExitCode)"
          $flux = $null
          for ($i = 0; $i -lt 20 -and -not $flux; $i++) { Start-Sleep 1; $flux = Get-Process Flux -ErrorAction SilentlyContinue }
          Start-Sleep 4; Shot 'after-update'
          if (-not $flux) { throw 'Flux did not open again after the update.' }
          $flux | Stop-Process -Force
          Write-Host 'Update test passed'
      - name: Publish update screenshots (branch ci-screens)
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update screenshots from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
