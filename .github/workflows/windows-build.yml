# Zostaví inštalátor Flux-Setup-x.y.z.exe pre Windows.
# Stiahneš ho v záložke Actions → posledný beh → Artifacts → Flux-Windows.
name: Windows build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Flux-Windows
          path: release/*.exe
          if-no-files-found: error
