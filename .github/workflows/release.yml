# Vydanie novej verzie: zvýš "version" v package.json a pridaj jej sekciu do CHANGELOG.md.
# Po pushnutí akcia zistí, či táto verzia už na GitHub Releases je; ak nie, zostaví inštalátor
# a vydá ju (tag vX.Y.Z vytvorí sama). Flux si novú verziu potom stiahne sám.
name: Release

on:
  push:
    branches: [main, 'claude/**']
    paths: ['package.json', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Hotové vydanie = má inštalátor aj latest.yml (podľa neho sa Flux aktualizuje).
          assets=$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$assets" | grep -q '^latest.yml$' && echo "$assets" | grep -q '\.exe$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # neúplné vydanie (napr. po chybe) zmazať, tag ostane
            if [ -n "$assets" ] || gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release delete "v$v" --repo "$GITHUB_REPOSITORY" --yes; fi
          fi
      - name: Create the version tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          t="v${{ steps.check.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
            git tag "$t" && git push origin "$t"
          fi
      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.exists == 'false'
        run: npm ci
      - if: steps.check.outputs.exists == 'false'
        run: node scripts/build.mjs
      - if: steps.check.outputs.exists == 'false'
        run: node scripts/release-notes.mjs
      - if: steps.check.outputs.exists == 'false'
        shell: bash
        run: npx electron-builder --win --publish always --config.releaseInfo.releaseNotesFile=build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
