# Vydanie novej verzie: zvýš "version" v package.json a pridaj jej sekciu do CHANGELOG.md.
# Po pushnutí akcia zistí, či táto verzia už na GitHub Releases je; ak nie, zostaví inštalátor
# a vydá ju (tag vX.Y.Z vytvorí sama). Flux si novú verziu potom stiahne sám.
# Vývojárska verzia: do package.json daj "devBuild": "<version>.N" (napr. 1.4.4.1). Vydá sa ako „pre-release“
# 1.4.5-beta.1 s beta.yml (novšia ako 1.4.4, staršia ako 1.4.5) – dostane ju len účet pantr1x, stránka ju neukazuje.
# Keď zvýšiš "version", starý devBuild už nesedí a vydá sa normálna verzia. Sekcia v CHANGELOG.md nie je nutná.
name: Release

on:
  push:
    branches: [main, 'claude/**']
    paths: ['package.json', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +o pipefail
          v=$(node -p "require('./package.json').version")
          d=$(node -p "require('./package.json').devBuild || ''")
          show="$v"
          # devBuild 1.4.4.N platí len k verzii 1.4.4 → semver 1.4.5-beta.N
          if [[ -n "$d" && "$d" == "$v".* && "$v" != *-* ]]; then
            IFS=. read -r a b c <<<"$v"
            show="$d"; v="$a.$b.$((c + 1))-beta.${d##*.}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "show=$show" >> "$GITHUB_OUTPUT"
          # predbežná verzia (1.5.0-beta.1) → kanál beta.yml, inak latest.yml
          if [[ "$v" == *-* ]]; then ch="${v#*-}"; ch="${ch%%.*}"; echo "pre=true" >> "$GITHUB_OUTPUT"; else ch=latest; echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          # Hotové vydanie = má inštalátor aj $ch.yml (podľa neho sa Flux aktualizuje).
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$v" --jq '.assets[].name' 2>/dev/null | tr -d '\r' || true)
          echo "Assets of v$v: ${assets:-none}"
          if grep -qx "$ch.yml" <<<"$assets" && grep -q '\.exe$' <<<"$assets"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # neúplné vydanie (napr. po chybe) zmazať, tag ostane
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release delete "v$v" --repo "$GITHUB_REPOSITORY" --yes && echo "Deleted incomplete release"; fi
          fi
          cat "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set the developer build version
        if: steps.check.outputs.exists == 'false' && steps.check.outputs.pre == 'true'
        run: npm pkg set "version=${{ steps.check.outputs.version }}"
      - if: steps.check.outputs.exists == 'false'
        run: npm ci
      - if: steps.check.outputs.exists == 'false'
        run: node scripts/build.mjs
      - if: steps.check.outputs.exists == 'false'
        run: node scripts/release-notes.mjs
      - if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # rýchla aktualizácia: len kód Fluxu (app.asar, ~5 MB) + quick.json – src/main/quickUpdate.js
      - if: steps.check.outputs.exists == 'false'
        run: node scripts/quick-pack.mjs "${{ steps.check.outputs.version }}"
      - name: Publish the release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.check.outputs.version }}"
          ls release
          if [ "${{ steps.check.outputs.pre }}" = true ]; then kind=--prerelease; title="Flux ${{ steps.check.outputs.show }} (dev build)"; else kind=--latest; title="Flux $v"; fi
          gh release create "v$v" release/Flux-Setup-$v.exe release/Flux-Setup-$v.exe.blockmap "release/${{ steps.check.outputs.channel }}.yml" \
            "release/Flux-$v.asar.gz" release/quick.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file build/release-notes.md $kind
