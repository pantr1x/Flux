# Flux Native (native/, čistý Rust + egui): zostaví ho na Windows a zmeria pamäť (ako Správca úloh).
# Výsledok: súhrn behu, vetva ci-native (native.png, memory.txt, Flux-Native.exe na stiahnutie, native.json pre aktualizácie), artefakt Flux-Native.
# Stiahnutie: https://github.com/pantr1x/Flux/raw/ci-native/Flux-Native.exe
name: Native build

on:
  push:
    branches: [main, 'claude/**']
    paths: ['native/**', 'crates/**', 'Cargo.toml', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Build Flux Native
        run: cargo build -p flux-native --release
      # podpis SignPath Foundation (zadarmo pre open-source): beží len keď je v repozitári tajomstvo SIGNPATH_API_TOKEN – inak sa preskočí
      - name: Upload unsigned exe for signing
        id: unsigned
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: target/release/flux-native.exe
      - name: Sign with SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed exe
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter flux-native.exe | Select-Object -First 1
          if (-not $signed) { Write-Host "::error::SignPath returned no flux-native.exe"; exit 1 }
          Copy-Item $signed.FullName target\release\flux-native.exe -Force
          $sig = Get-AuthenticodeSignature target\release\flux-native.exe
          "## Code signing: $($sig.Status) – $($sig.SignerCertificate.Subject)" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($sig.Status -ne 'Valid') { Write-Host "::error::signature is $($sig.Status)"; exit 1 }
      - name: Windows Defender check (no publish when the build is flagged)
        shell: pwsh
        run: |
          # aktuálne definície (ak sa dá) a sken samotného programu; nález = žiadna aktualizácia pre ľudí
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Host "signature update failed: $_" }
          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $mp) { $mp = Get-Item "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -ErrorAction SilentlyContinue }
          if (-not $mp) { "## Defender check skipped (MpCmdRun not found)" | Add-Content $env:GITHUB_STEP_SUMMARY; exit 0 }
          $exe = (Get-Item target\release\flux-native.exe).FullName
          $out = & $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $ver = (Get-MpComputerStatus -ErrorAction SilentlyContinue).AntivirusSignatureVersion
          if ($code -eq 2) {
            "## Windows Defender FLAGGED the build (signatures $ver)`n``````n$out`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Host "::error::Windows Defender flagged Flux-Native.exe"
            exit 1
          }
          "## Windows Defender: clean (signatures $ver, exit $code)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Smoke test (must start with real-world settings)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory out -Force | Out-Null
          # nastavenia ako u skutočného používateľa: domovská obrazovka, viac projektov s ikonami a úlohami,
          # GitHub účet vývojára, AI s kľúčmi z Electron Fluxu, priehľadné okno (liveCache), diakritika
          $root = "$env:RUNNER_TEMP\smoke-projects"
          $dirs = @('python-hra', 'moja-stránka', 'api-tools') | ForEach-Object { $d = "$root\$_"; New-Item -ItemType Directory $d -Force | Out-Null; $d }
          Set-Content "$($dirs[0])\main.py" "print('ahoj')"
          Set-Content "$($dirs[1])\index.html" "<h1>Ahoj</h1>"
          Set-Content "$($dirs[2])\main.rs" "fn main() {}"
          $img = "$env:RUNNER_TEMP\smoke-wall.png"
          $bmp = New-Object System.Drawing.Bitmap 64, 64; $bmp.Save($img, [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          $meta = @{}
          $meta[$dirs[0]] = @{ description = 'Hra s hadom'; kind = 'python'; icon = 'emoji:🎮'; todos = @(@{ id = 1; text = 'Skóre'; done = $false }) }
          $meta[$dirs[1]] = @{ description = 'Web'; kind = 'web'; icon = 'line:robot'; todos = @() }
          $ud = "$env:RUNNER_TEMP\ud-smoke"; New-Item -ItemType Directory $ud -Force | Out-Null
          @{
            onboarded = $true; lastFolder = $dirs[0]; userName = 'Šimon'; autoUpdate = $false; lastSeenVersion = 'x'
            projects = @($dirs | ForEach-Object { @{ dir = $_; pinned = ($_ -eq $dirs[0]) } }); recent = $dirs
            projectMeta = $meta
            github = @{ token = 'enc:djEwAAAAAAAAAAAAAAAAAAAA'; user = @{ login = 'pantr1x'; name = 'Šimon'; id = 1; avatar = $null } }
            ai = @{ key = 'enc:djEwBBBB'; model = 'claude-opus-5'; mcp = @(@{ name = 'github'; url = 'https://example.com/mcp'; enabled = $true; token = 'enc:x' }) }
            liveCache = @{ file = $img; video = $false; preview = $img; source = 'lively' }
            material = 'blur'
            codeLangs = @('python', 'web')
          } | ConvertTo-Json -Depth 8 | Set-Content "$ud\settings.json" -Encoding utf8NoBOM
          $env:FLUX_USER_DATA = $ud
          $env:FLUX_TEST = "2:start;4:settings=general;5:settings=ai;6:settings=github;7:settings=developer;8:settings=plugins;9:newproj;11:ai;13:back;14:fwd"
          $p = Start-Process (Get-ChildItem target\release\flux-native.exe).FullName -PassThru
          Start-Sleep 25
          $p.Refresh()
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($shot); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $shot.Save("out\smoke.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $shot.Dispose()
          $crash = "$ud\flux-native-crash.log"
          $problems = @()
          if ($p.HasExited) { $problems += "Flux Native exited (code $($p.ExitCode))" }
          elseif ($p.MainWindowHandle -eq 0) { $problems += "Flux Native runs but has no window" }
          else {
            # musí mať skutočné viditeľné okno aspoň 300×200 (MainWindowHandle býva aj pomocné 16×16 okno)
            Add-Type -Name W -Namespace U -MemberDefinition @'
          public delegate bool EnumProc(IntPtr h, IntPtr l);
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          public struct RECT { public int L, T, R, B; }
          public static bool HasBigWindow(uint pid) {
            bool found = false;
            EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); RECT r;
              if (p == pid && IsWindowVisible(h) && GetWindowRect(h, out r) && r.R - r.L >= 300 && r.B - r.T >= 200) { found = true; return false; } return true; }, IntPtr.Zero);
            return found;
          }
          '@
            if (-not [U.W]::HasBigWindow([uint32]$p.Id)) { $problems += "Flux Native has no visible window" }
          }
          if (Test-Path $crash) { $problems += "crash log: $(Get-Content $crash -Raw)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item Env:FLUX_TEST, Env:FLUX_USER_DATA
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            "## Smoke test FAILED`n$($problems -join "`n")" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          "## Smoke test passed" | Add-Content $env:GITHUB_STEP_SUMMARY
      # aktualizácia ako u používateľa: program s iným menom, odkaz naň (pripnutie) a odkaz pokazený starou výmenou (.old);
      # po aktualizácii musí ísť o ten istý súbor (ID súboru), nová verzia beží s oknom a odkazy ukazujú na program
      - name: Update test (same file, pins kept, restart)
        shell: pwsh
        run: |
          $u = "$env:RUNNER_TEMP\upd"; $srv = "$u\srv"; $app = "$u\app"; $pins = "$u\pins"; $ud = "$u\ud"
          New-Item -ItemType Directory $srv, $app, $pins, $ud -Force | Out-Null
          $build = (Get-Item target\release\flux-native.exe).FullName
          $exe = "$app\Flux-Native(18).exe"
          Copy-Item $build $exe
          Copy-Item $build "$srv\Flux-Native.exe"
          $hash = (Get-FileHash $build -Algorithm SHA256).Hash.ToLower()
          @{ version = '9.9.9'; sha = 'ci-update-test'; sha256 = $hash; size = (Get-Item $build).Length } | ConvertTo-Json | Set-Content "$srv\native.json" -Encoding utf8NoBOM
          '{"onboarded":true,"autoUpdate":false}' | Set-Content "$ud\settings.json" -Encoding utf8NoBOM
          $sh = New-Object -ComObject WScript.Shell
          $l = $sh.CreateShortcut("$pins\Flux.lnk"); $l.TargetPath = $exe; $l.Save()
          $l = $sh.CreateShortcut("$pins\Flux broken.lnk"); $l.TargetPath = "$app\Flux-Native(18).old"; $l.Save()
          $id0 = (fsutil file queryfileid $exe) | Out-String
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $srv -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $env:FLUX_USER_DATA = $ud; $env:FLUX_UPDATE_URL = 'http://127.0.0.1:8765/'; $env:FLUX_PINS_DIR = $pins
          $env:FLUX_TEST = "3:update;6:update-get;15:update-install"
          $first = Start-Process $exe -PassThru
          Remove-Item Env:FLUX_TEST
          $problems = @()
          $new = $null
          foreach ($i in 1..60) {
            Start-Sleep 1
            $new = Get-CimInstance Win32_Process -Filter "Name = 'Flux-Native(18).exe'" | Where-Object { $_.CommandLine -like '*--updated*' } | Select-Object -First 1
            if ($new) { break }
          }
          if (-not $new) { $problems += "Flux did not start again after the update" }
          Start-Sleep 15
          Add-Type -Name W2 -Namespace U -MemberDefinition @'
          public delegate bool EnumProc(IntPtr h, IntPtr l);
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          public struct RECT { public int L, T, R, B; }
          public static bool HasBigWindow(uint pid) {
            bool found = false;
            EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); RECT r;
              if (p == pid && IsWindowVisible(h) && GetWindowRect(h, out r) && r.R - r.L >= 300 && r.B - r.T >= 200) { found = true; return false; } return true; }, IntPtr.Zero);
            return found;
          }
          '@
          if ($new -and -not (Get-Process -Id $new.ProcessId -ErrorAction SilentlyContinue)) { $problems += "the updated Flux exited" }
          elseif ($new -and -not [U.W2]::HasBigWindow([uint32]$new.ProcessId)) { $problems += "the updated Flux has no visible window" }
          if (-not $first.HasExited) { $problems += "the old Flux is still running" }
          $id1 = (fsutil file queryfileid $exe) | Out-String
          if ($id0 -ne $id1) { $problems += "the program file was replaced (file id $id0 -> $id1), a taskbar pin would break" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $hash) { $problems += "the program file has the wrong content after the update" }
          if (Test-Path "$app\Flux-Native(18).new") { $problems += "the downloaded .new file was not removed" }
          $t = $sh.CreateShortcut("$pins\Flux.lnk").TargetPath
          if ($t -ne $exe) { $problems += "shortcut Flux.lnk points to $t" }
          # Flux pri štarte odkazy neprepisuje (Windows Defender to považuje za podozrivé) – iný odkaz ostane, ako bol
          $t = $sh.CreateShortcut("$pins\Flux broken.lnk").TargetPath
          if ($t -ne "$app\Flux-Native(18).old") { $problems += "Flux changed another shortcut (Flux broken.lnk -> $t)" }
          if (Test-Path "$ud\flux-native-crash.log") { $problems += "crash log: $(Get-Content "$ud\flux-native-crash.log" -Raw)" }
          Get-ChildItem $app | Format-Table Name, Length | Out-String | Write-Host
          Get-CimInstance Win32_Process -Filter "Name like 'Flux-Native%'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Remove-Item Env:FLUX_USER_DATA, Env:FLUX_UPDATE_URL, Env:FLUX_PINS_DIR
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            "## Update test FAILED`n$($problems -join "`n")" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          "## Update test passed (same file, pins kept, restarted)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Migration test (old Electron Flux → Flux Native, one Flux)
        shell: pwsh
        run: |
          $m = "$env:RUNNER_TEMP\mig"; $pins = "$m\pins"; $ud = "$m\ud"; $nat = "$m\native"
          $old = "$env:LOCALAPPDATA\Programs\flux-ci-test"
          New-Item -ItemType Directory $pins, $ud, $nat, "$old\resources" -Force | Out-Null
          $exe = "$nat\Flux-Native.exe"
          Copy-Item target\release\flux-native.exe $exe
          # falošný starý Flux + odkaz naň
          Copy-Item "$env:WINDIR\System32\notepad.exe" "$old\Flux.exe"
          Set-Content "$old\resources\app.asar" "x"
          '{"onboarded":true,"autoUpdate":false}' | Set-Content "$ud\settings.json" -Encoding utf8NoBOM
          $sh = New-Object -ComObject WScript.Shell
          $l = $sh.CreateShortcut("$pins\Flux.lnk"); $l.TargetPath = "$old\Flux.exe"; $l.Save()
          $l = $sh.CreateShortcut("$pins\Other.lnk"); $l.TargetPath = "$env:WINDIR\System32\notepad.exe"; $l.Save()
          $env:FLUX_USER_DATA = $ud; $env:FLUX_PINS_DIR = $pins
          $p = Start-Process $exe -ArgumentList '--migrate', '0', "`"$old\Flux.exe`"", '--no-window' -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force }
          $problems = @()
          $t = $sh.CreateShortcut("$pins\Flux.lnk").TargetPath
          if ($t -ne $exe) { $problems += "Flux.lnk points to $t, not to Flux Native" }
          if ($sh.CreateShortcut("$pins\Other.lnk").TargetPath -notlike '*notepad.exe') { $problems += "an unrelated shortcut was changed" }
          # Native nesmie mazať iné programy (Defender ho za to v 0.9.18 zmazal)
          if (-not (Test-Path "$old\Flux.exe")) { $problems += "the old Flux was deleted" }
          $s = Get-Content "$ud\settings.json" -Raw | ConvertFrom-Json
          if (-not $s.migratedFromElectron) { $problems += "settings have no migratedFromElectron" }
          if ($s.nativePath -ne $exe) { $problems += "settings nativePath is '$($s.nativePath)'" }
          # jeden Flux: druhé spustenie so súborom odovzdá súbor prvému a hneď skončí
          Set-Content "$m\hello.py" "print('hi')"
          $first = Start-Process $exe -PassThru
          Start-Sleep 12
          $second = Start-Process $exe -ArgumentList "`"$m\hello.py`"" -PassThru
          if (-not $second.WaitForExit(10000)) { $problems += "a second Flux start did not hand over to the running one"; Stop-Process -Id $second.Id -Force }
          if ($first.HasExited) { $problems += "the first Flux exited" }
          if (Test-Path "$ud\flux-native-crash.log") { $problems += "crash log: $(Get-Content "$ud\flux-native-crash.log" -Raw)" }
          Get-CimInstance Win32_Process -Filter "Name = 'Flux-Native.exe'" | Where-Object { $_.ExecutablePath -eq $exe } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item Env:FLUX_USER_DATA, Env:FLUX_PINS_DIR
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            "## Migration test FAILED`n$($problems -join "`n")" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          "## Migration test passed (shortcut moved, old Flux kept as launcher, one Flux)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Plugin test (QuickJS plugins load, run and draw)
        shell: pwsh
        run: |
          $u = "$env:RUNNER_TEMP\plug"; $ud = "$u\ud"; $proj = "$u\proj"
          New-Item -ItemType Directory $ud, $proj -Force | Out-Null
          Set-Content "$proj\t.py" "# TODO: test`nprint(1)"
          @{ onboarded = $true; autoUpdate = $false; nativeSeenVersion = '9.9.9'; lastFolder = $proj; projects = @(@{ dir = $proj }) } | ConvertTo-Json -Depth 4 | Set-Content "$ud\settings.json" -Encoding utf8NoBOM
          $env:FLUX_USER_DATA = $ud; $env:FLUX_PLUGIN_REGISTRY = (Resolve-Path plugins).Path
          $env:FLUX_TEST = "1:plugin-install=flux.todo-highlight;2:plugin-install=flux.word-count;3:plugin-install=flux.theme-pack;4:plugin-install=flux.snippet-pack;5:open=t.py;7:plugin-cmd=flux.word-count|show;8:theme=gruvbox;10:plugin-store"
          $p = Start-Process target\release\flux-native.exe -PassThru
          Start-Sleep 16
          $problems = @()
          if ($p.HasExited) { $problems += "Flux exited (code $($p.ExitCode))" }
          if (Test-Path "$ud\flux-native-crash.log") { $problems += "crash log: $(Get-Content "$ud\flux-native-crash.log" -Raw)" }
          foreach ($id in 'flux.todo-highlight', 'flux.word-count', 'flux.theme-pack', 'flux.snippet-pack') { if (-not (Test-Path "$ud\native-plugins\$id\plugin.json")) { $problems += "$id was not installed" } }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Remove-Item Env:FLUX_TEST, Env:FLUX_USER_DATA, Env:FLUX_PLUGIN_REGISTRY
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            "## Plugin test FAILED`n$($problems -join "`n")" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          "## Plugin test passed (4 plugins installed and running)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Measure memory (Flux Native)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory out -Force | Out-Null
          # rovnaký malý projekt a nastavenia pre obe verzie
          $proj = "$env:RUNNER_TEMP\demo-project"
          New-Item -ItemType Directory $proj -Force | Out-Null
          Set-Content "$proj\main.py" ("import os`n" + ((1..200) | ForEach-Object { "print('line $_')" }) -join "`n")
          Set-Content "$proj\index.html" "<!doctype html><h1>Hi</h1>"
          function Settings($dir) {
            New-Item -ItemType Directory $dir -Force | Out-Null
            @{ onboarded = $true; lastFolder = $proj; projects = @(@{ dir = $proj; pinned = $false }); recent = @($proj); translucent = $false; autoUpdate = $false; lastSeenVersion = 'x' } | ConvertTo-Json -Depth 5 | Set-Content "$dir\settings.json"
          }
          function Tree($rootPid) {
            $all = Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name
            $ids = @($rootPid); $added = $true
            while ($added) { $added = $false; foreach ($p in $all) { if ($ids -contains $p.ParentProcessId -and -not ($ids -contains $p.ProcessId)) { $ids += $p.ProcessId; $added = $true } } }
            $ids
          }
          function Get-FluxMem($rootPid) {
            # „Pamäť“ zo Správcu úloh = súkromná pracovná množina; id a hodnota v tom istom riadku (žiadne párovanie podľa mena)
            $ids = Tree $rootPid
            $perf = Get-CimInstance Win32_PerfFormattedData_PerfProc_Process | Where-Object { $ids -contains [int]$_.IDProcess }
            $procs = Get-Process -Id $ids -ErrorAction SilentlyContinue
            @{
              priv = [math]::Round((($perf | Measure-Object WorkingSetPrivate -Sum).Sum) / 1MB, 1)
              ws = [math]::Round((($procs | Measure-Object WorkingSet64 -Sum).Sum) / 1MB, 1)
              rows = @($perf | Sort-Object WorkingSetPrivate -Descending | ForEach-Object { "{0,8:N1} MB  {1} (pid {2})" -f ($_.WorkingSetPrivate / 1MB), $_.Name, $_.IDProcess })
              count = $ids.Count
            }
          }
          function Start-FluxRun($label, $exe, $argList) {
            $p = if ($argList) { Start-Process $exe -ArgumentList $argList -PassThru } else { Start-Process $exe -PassThru }
            Start-Sleep 20
            Shot $label
            # tri merania po 2 s, berie sa stredné
            $ms = @(); for ($i = 0; $i -lt 3; $i++) { $ms += ,(Get-FluxMem $p.Id); Start-Sleep 2 }
            $mid = @($ms | Sort-Object { $_['priv'] })[[math]::Floor($ms.Count / 2)]
            if (-not $mid) { $mid = $ms[-1] }
            $out = @("$label : $($mid.priv) MB private (Task Manager), $($mid.ws) MB working set, $($mid.count) processes") + ($mid.rows | ForEach-Object { "   $_" })
            Stop-Process -Id (Tree $p.Id) -Force -ErrorAction SilentlyContinue
            Start-Sleep 1
            $out
          }
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }
          $report = @()
          $nd = "$env:RUNNER_TEMP\ud-native"; Settings $nd
          $env:FLUX_USER_DATA = $nd
          $env:FLUX_TEST = "2:open=main.py"
          try { $report += Start-FluxRun 'native' (Get-ChildItem target\release\flux-native.exe).FullName $null } catch { $report += "native: measurement failed: $_" }
          # živá tapeta (falošný Lively s ukážkovým videom): len pri ručnom spustení (sťahuje video a trvá ~2 min)
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { try {
            $lv = "$env:RUNNER_TEMP\fake-local"; $wp = "$lv\wp1"
            New-Item -ItemType Directory "$lv\Lively Wallpaper", $wp -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4" -OutFile "$wp\video.mp4"
            '{"FileName":"video.mp4","Title":"test"}' | Set-Content "$wp\LivelyInfo.json"
            ('[{"LivelyInfoPath":"' + ($wp -replace '\\','\\') + '"}]') | Set-Content "$lv\Lively Wallpaper\WallpaperLayout.json"
            $realLocal = $env:LOCALAPPDATA; $env:LOCALAPPDATA = $lv; $env:FLUX_LIVE_TEST = "1"
            foreach ($mode in @('still', 'play')) {
              $d = "$env:RUNNER_TEMP\ud-live-$mode"; Settings $d
              $j = Get-Content "$d\settings.json" | ConvertFrom-Json; $j | Add-Member liveWallMode $mode -Force; $j | Add-Member material 'wallpaper' -Force; $j | Add-Member seeMigrated $true -Force; $j | ConvertTo-Json -Depth 5 | Set-Content "$d\settings.json"
              $env:FLUX_USER_DATA = $d
              $report += Start-FluxRun "native-live-$mode" (Get-ChildItem target\release\flux-native.exe).FullName $null
            }
            $env:LOCALAPPDATA = $realLocal; Remove-Item Env:FLUX_LIVE_TEST
          } catch { $report += "live wallpaper measurement skipped: $_" } }
          $report += "Program size: $([math]::Round((Get-Item target\release\flux-native.exe).Length / 1MB, 1)) MB"
          $report | Set-Content out\memory.txt
          # program na stiahnutie a vyskúšanie (bez inštalátora, rovnaké nastavenia ako Electron Flux)
          Copy-Item target\release\flux-native.exe out\Flux-Native.exe
          # native.json: podľa neho sa Flux Native aktualizuje z Nastavení (update.rs porovná sha so svojím FLUX_SHA)
          $ver = (Select-String -Path native\Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $hash = (Get-FileHash out\Flux-Native.exe -Algorithm SHA256).Hash.ToLower()
          $info = @{ version = $ver; sha = $env:GITHUB_SHA; sha256 = $hash; size = (Get-Item out\Flux-Native.exe).Length }
          # rozdiel oproti predošlej zostave v ci-native (zstd patch-from): aktualizácia stiahne len zmenu
          try {
            $raw = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/ci-native"
            $prev = Invoke-RestMethod -TimeoutSec 60 "$raw/native.json"
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 "$raw/Flux-Native.exe" -OutFile "$env:RUNNER_TEMP\prev.exe"
            if ($prev.sha -and $prev.sha -ne $env:GITHUB_SHA -and (Get-FileHash "$env:RUNNER_TEMP\prev.exe" -Algorithm SHA256).Hash.ToLower() -eq $prev.sha256) {
              $p = Start-Process out\Flux-Native.exe -ArgumentList '--make-patch', "$env:RUNNER_TEMP\prev.exe", 'out\Flux-Native.exe', 'out\Flux-Native.patch' -Wait -PassThru -NoNewWindow
              if ($p.ExitCode -eq 0 -and (Test-Path out\Flux-Native.patch)) {
                $info.patch = @{ from = $prev.sha; sha256 = (Get-FileHash out\Flux-Native.patch -Algorithm SHA256).Hash.ToLower(); size = (Get-Item out\Flux-Native.patch).Length }
                Write-Host "patch from $($prev.version): $([math]::Round($info.patch.size / 1KB)) kB"
              }
            }
          } catch { Write-Host "no patch: $_" }
          $info | ConvertTo-Json | Set-Content out\native.json -Encoding utf8NoBOM
          $report | ForEach-Object { Write-Host $_ }
          "## Memory`n``````n$($report -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
      # native.json v ci-native = kanál aktualizácií: len zostava, ktorá prešla smoke testom
      - name: Publish screenshots (branch ci-native)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b ci-native
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Native measurement from ${GITHUB_SHA::7}"
          for i in 1 2 3 4; do git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-native && exit 0; sleep $((i * 5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flux-Native
          path: |
            out/*
            target/release/flux-native.exe
