# Solarized Light – Flux theme
# One line per value: key, spaces, then a color (#rrggbb). Lines with # are comments.
# Guide: docs/THEMES.md

name        Solarized Light
mode        light   # dark or light

# code colors
fg          #657b83   # normal text
comment     #93a1a1   # comments
keyword     #859900   # if, for, return, def…
storage     #cb4b16   # true, None, self, int…
string      #2aa198   # "text in quotes"
number      #d33682   # 42, 3.14
type        #b58900   # class and type names
function    #268bd2   # function names
variable    #586e75   # variables
parameter   #586e75   # function parameters
property    #268bd2   # object.property
constant    #cb4b16   # CONSTANTS
tag         #268bd2   # <div> HTML tags
attr        #b58900   # class="…" attributes
delimiter   #586e75   # brackets, commas, operators
regexp      #dc322f   # regular expressions

# app colors (optional)
background  #eee8d5   # around the panels
panel       #fdf6e3   # editor and sidebar
text        #586e75   # menus and file names
text2       #93a1a1   # hints and small text
border      #e4ddc8   # lines between parts
accent      #268bd2   # buttons and highlights
