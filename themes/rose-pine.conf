# Rosé Pine – Flux theme
# One line per value: key, spaces, then a color (#rrggbb). Lines with # are comments.
# Guide: docs/THEMES.md

name        Rosé Pine
mode        dark   # dark or light

# code colors
fg          #e0def4   # normal text
comment     #6e6a86   # comments
keyword     #3e8fb0   # if, for, return, def…
storage     #eb6f92   # true, None, self, int…
string      #f6c177   # "text in quotes"
number      #ebbcba   # 42, 3.14
type        #9ccfd8   # class and type names
function    #ebbcba   # function names
variable    #e0def4   # variables
parameter   #c4a7e7   # function parameters
property    #9ccfd8   # object.property
constant    #eb6f92   # CONSTANTS
tag         #9ccfd8   # <div> HTML tags
attr        #c4a7e7   # class="…" attributes
delimiter   #908caa   # brackets, commas, operators
regexp      #eb6f92   # regular expressions

# app colors (optional)
background  #191724   # around the panels
panel       #1f1d2e   # editor and sidebar
text        #e0def4   # menus and file names
text2       #908caa   # hints and small text
border      #26233a   # lines between parts
accent      #c4a7e7   # buttons and highlights
