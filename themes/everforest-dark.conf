# Everforest Dark – Flux theme
# One line per value: key, spaces, then a color (#rrggbb). Lines with # are comments.
# Guide: docs/THEMES.md

name        Everforest Dark
mode        dark   # dark or light

# code colors
fg          #d3c6aa   # normal text
comment     #859289   # comments
keyword     #e67e80   # if, for, return, def…
storage     #d699b6   # true, None, self, int…
string      #a7c080   # "text in quotes"
number      #d699b6   # 42, 3.14
type        #dbbc7f   # class and type names
function    #83c092   # function names
variable    #d3c6aa   # variables
parameter   #7fbbb3   # function parameters
property    #7fbbb3   # object.property
constant    #d699b6   # CONSTANTS
tag         #e69875   # <div> HTML tags
attr        #dbbc7f   # class="…" attributes
delimiter   #9da9a0   # brackets, commas, operators
regexp      #e69875   # regular expressions

# app colors (optional)
background  #272e33   # around the panels
panel       #2d353b   # editor and sidebar
text        #d3c6aa   # menus and file names
text2       #9da9a0   # hints and small text
border      #3d484d   # lines between parts
accent      #a7c080   # buttons and highlights
