# Gruvbox Dark – Flux theme
# One line per value: key, spaces, then a color (#rrggbb). Lines with # are comments.
# Guide: docs/THEMES.md

name        Gruvbox Dark
mode        dark   # dark or light

# code colors
fg          #ebdbb2   # normal text
comment     #928374   # comments
keyword     #fb4934   # if, for, return, def…
storage     #d3869b   # true, None, self, int…
string      #b8bb26   # "text in quotes"
number      #d3869b   # 42, 3.14
type        #fabd2f   # class and type names
function    #8ec07c   # function names
variable    #ebdbb2   # variables
parameter   #83a598   # function parameters
property    #83a598   # object.property
constant    #d3869b   # CONSTANTS
tag         #fb4934   # <div> HTML tags
attr        #fabd2f   # class="…" attributes
delimiter   #a89984   # brackets, commas, operators
regexp      #fe8019   # regular expressions

# app colors (optional)
background  #1d2021   # around the panels
panel       #282828   # editor and sidebar
text        #ebdbb2   # menus and file names
text2       #a89984   # hints and small text
border      #3c3836   # lines between parts
accent      #fe8019   # buttons and highlights
