# Pomocník pre náhľad Live Servera na Linuxe: WebKitGTK stránka ako podokno okna Fluxu (X11).
# Samostatný program, aby Flux sám nepotreboval knižnicu webkit2gtk (bez nej len nefunguje náhľad).
[package]
name = "flux-preview"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.57"
gtk = "0.18"
raw-window-handle = "0.6"
serde_json = "1"
