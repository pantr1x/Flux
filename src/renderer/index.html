<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src http://127.0.0.1:* http://localhost:*; connect-src 'self'"
    />
    <title>Flux</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-dark">
    <div id="app">
      <div id="peek-zone"></div>
      <aside id="sidebar">
        <div class="side-top drag">
          <div class="brand"><span class="brand-mark" id="brand-mark"></span>flux</div>
          <button class="icon-btn no-drag" id="btn-compact" title="Hide sidebar (Ctrl+B)"></button>
        </div>

        <div class="projects" id="projects"></div>

        <div class="essentials" id="essentials">
          <button class="icon-btn" data-cmd="new-file" title="New file from template (Ctrl+N)"></button>
          <button class="icon-btn" data-cmd="new-folder" title="New folder"></button>
          <button class="icon-btn" data-cmd="refresh" title="Refresh"></button>
          <button class="icon-btn" data-cmd="collapse" title="Collapse all"></button>
        </div>

        <div id="tree" tabindex="0"></div>

        <div class="side-bottom">
          <div class="grow"></div>
          <button class="icon-btn" id="btn-theme" title="Light / dark theme"></button>
          <button class="icon-btn" id="btn-palette" title="Commands (Ctrl+Shift+P)"></button>
          <button class="icon-btn" id="btn-settings" title="Settings (Ctrl+,)"></button>
        </div>
      </aside>
      <div class="resizer rz-col" id="side-resizer"></div>

      <main id="main">
        <header id="topbar" class="drag">
          <button class="icon-btn no-drag" id="btn-expand" title="Show sidebar (Ctrl+B)"></button>
          <span class="nav-btns no-drag" id="topnav"></span>
          <div id="tabs" class="no-drag"></div>
          <div class="grow"></div>
          <div class="actions no-drag">
            <button class="chip-btn ai-btn" id="btn-ai" title="AI assistant (Ctrl+I)"></button>
            <button class="chip-btn" id="btn-live" title="Live Server (Alt+L)"></button>
            <button class="run-btn" id="btn-run" title="Run (F5)"></button>
            <button class="stop-btn" id="btn-stop" title="Stop (Shift+F5)" disabled></button>
          </div>
          <div class="caption-space"></div>
        </header>

        <section id="card">
          <div id="workarea">
            <div id="editor-wrap">
              <div id="editor"></div>
              <div id="codemap" hidden></div>
              <div id="welcome"></div>
              <button class="md-toggle" id="md-toggle" hidden></button>
            </div>
            <div class="resizer rz-col" id="md-resizer" hidden></div>
            <div id="mdview" hidden>
              <div class="preview-bar"><span class="mdview-title" id="mdview-name"></span><div class="grow"></div><button class="icon-btn" id="mdview-close" title="Close preview"></button></div>
              <div class="mdview-body ai-body" id="mdview-body"></div>
            </div>
            <div class="resizer rz-col" id="preview-resizer" hidden></div>
            <div id="preview" hidden>
              <div class="preview-bar">
                <span class="live-dot"></span>
                <span class="preview-url" id="preview-url"></span>
                <div class="grow"></div>
                <div class="seg" id="devices">
                  <button data-w="" class="active" title="Full width"></button>
                  <button data-w="820" title="Tablet (820 px)"></button>
                  <button data-w="390" title="Phone (390 px)"></button>
                </div>
                <button class="icon-btn" id="btn-preview-reload" title="Refresh"></button>
                <button class="icon-btn" id="btn-preview-external" title="Open in browser"></button>
                <button class="icon-btn" id="btn-preview-close" title="Close preview"></button>
              </div>
              <div class="preview-stage"><iframe id="preview-frame" title="Preview"></iframe></div>
            </div>
            <div class="resizer rz-col" id="ai-resizer" hidden></div>
            <aside id="ai" hidden></aside>
          </div>

          <div class="resizer rz-row" id="panel-resizer"></div>
          <div id="panel">
            <div class="panel-bar">
              <span class="panel-title" id="panel-title" data-t>Output</span>
              <span class="run-state" id="run-state"></span>
              <div id="hint"></div>
              <div class="grow"></div>
              <button class="icon-btn" id="btn-clear" title="Clear output"></button>
              <button class="icon-btn" id="btn-panel" title="Hide panel (Ctrl+J)"></button>
            </div>
            <div id="terminal"></div>
          </div>

          <footer id="statusbar">
            <button class="status-item" id="st-python" title="Python interpreter"></button>
            <button class="status-item" id="st-git" hidden></button>
            <button class="status-item" id="st-problems" hidden></button>
            <span class="status-item" id="st-lsp"></span>
            <div class="grow"></div>
            <button class="status-item" id="st-install" hidden></button>
            <button class="status-item" id="st-live" hidden></button>
            <button class="status-item" id="st-autosave" title="Auto save"></button>
            <span class="status-item" id="st-lang"></span>
            <span class="status-item" id="st-pos"></span>
          </footer>
        </section>
      </main>
    </div>

    <div id="overlay" hidden>
      <div id="palette" role="dialog">
        <input id="palette-input" spellcheck="false" autocomplete="off" />
        <div id="palette-list" role="listbox"></div>
      </div>
    </div>
    <div id="settings" hidden></div>
    <div id="start" hidden></div>
    <div id="glance" hidden></div>
    <div id="newproj" hidden></div>
    <div id="tcask" hidden></div>
    <div id="ghpick" hidden></div>
    <div id="tour" hidden></div>
    <div id="onboard" hidden></div>
    <div id="toasts"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
