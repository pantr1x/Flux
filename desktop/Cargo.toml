[package]
name = "flux"
version = "0.1.0"
description = "Flux – code editor (Tauri build)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
portable-pty = "0.9"
rfd = "0.15"
trash = "5"
notify = "8"
base64 = "0.22"

[profile.release]
# čo najmenší a najrýchlejší program
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
