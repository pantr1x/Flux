[package]
name = "flux"
version = "0.1.0"
description = "Flux – code editor (Tauri build)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
notify = "8"
flux-core = { path = "../crates/flux-core" }
